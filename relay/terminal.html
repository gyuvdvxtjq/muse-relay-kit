<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MUSE Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#1e1e1e;}
  #term{width:100%;height:100%;padding:8px;box-sizing:border-box;}
</style>
</head>
<body>
<div id="term"></div>
<script>
const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(wsProto + '://' + location.host + '/term?token=' + new URLSearchParams(location.search).get('token'));
const term = new window.Terminal({ cursorBlink: true, fontSize: 14, theme: { background: '#1e1e1e' } });
const fit = new window.FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
term.onData(d => { if (ws.readyState === 1) ws.send(d); });
ws.onmessage = e => {
  if (e.data instanceof Blob) { e.data.text().then(t => term.write(t)); }
  else {
    if (e.data.startsWith('{')) { try { const j = JSON.parse(e.data); if (j.type === 'resize') return; } catch {} }
    term.write(e.data);
  }
};
ws.onclose = () => term.write('\r\n\x1b[31m[连接已断开，刷新页面重试]\x1b[0m\r\n');
window.addEventListener('resize', () => {
  fit.fit();
  if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
});
ws.onopen = () => ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
</script>
</body>
</html>
